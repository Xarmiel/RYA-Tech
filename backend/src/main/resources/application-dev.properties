spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging para diagnóstico en desarrollo
logging.level.com.ecommerce.backend=DEBUG
logging.level.org.springframework.security=INFO

# Orígenes CORS por defecto para desarrollo local
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:3000}
