# ============================================================================
# Perfil PROD (Despliegue en Render / Cloud)
# ============================================================================
spring.jpa.show-sql=false
spring.sql.init.mode=never
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
spring.jpa.properties.hibernate.format_sql=false

# Logging optimizado para producción
logging.level.com.ecommerce.backend=INFO
logging.level.org.springframework.security=WARN

# Optimización del Pool de Conexiones HikariCP para plan Free/Starter de Render (512MB RAM)
# y conexión mediante el Pooler de Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# CORS en producción: restringido al dominio exacto autorizado de Vercel vía CORS_ALLOWED_ORIGINS
# (ej. https://rya-tech.vercel.app). NUNCA usar comodín *.vercel.app.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
