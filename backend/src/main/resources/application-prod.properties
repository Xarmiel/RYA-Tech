# ============================================================================
# Perfil PROD (Despliegue en Render / Cloud)
# ============================================================================
spring.jpa.show-sql=false
spring.sql.init.mode=never
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
spring.jpa.properties.hibernate.format_sql=false

# Logging optimizado para producción
logging.level.com.ecommerce.backend=INFO
logging.level.org.springframework.security=WARN

# El pool reducido está definido en application.properties y también se aplica en local.

# CORS en producción: restringido al dominio exacto autorizado de Vercel vía CORS_ALLOWED_ORIGINS
# (ej. https://rya-tech.vercel.app). NUNCA usar comodín *.vercel.app.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
