spring.application.name=ecommerce-backend

# Canales públicos de soporte. Vacíos hasta que el negocio proporcione datos reales.
soporte.email=${SUPPORT_EMAIL:}
soporte.telefono=${SUPPORT_PHONE:}
soporte.whatsapp=${SUPPORT_WHATSAPP:}
soporte.horario=${SUPPORT_HOURS:}

# Perfil activo por defecto: dev si no se especifica SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Carga local segura. Permite iniciar Maven desde backend/ o desde la raíz.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ============================================================================
# Conexión PostgreSQL / Supabase
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Límite compartido por desarrollo y producción: cada compañero/instancia usa su propio pool.
# Hikari no debe reservar diez sesiones locales por defecto en el pooler compartido.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================================
# Hibernate & JPA (Esquema obligatorio 'rya', NO crear ni alterar tablas)
# ============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:rya}

# El backend es exclusivamente REST. El frontend se sirve desde Angular.
spring.web.resources.add-mappings=false
spring.web.resources.static-locations=classpath:/api-static/
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ============================================================================
# Servidor Web y OpenAPI / Swagger
# ============================================================================
server.port=${PORT:8080}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ============================================================================
# Configuración CORS
# ============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://*.localhost:*,http://127.0.0.1:*,http://localhost:4200,http://www.localhost:4200,http://127.0.0.1:4200,http://localhost:3000}

# Supabase Auth: Spring valida localmente cada access token con el JWKS público.
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER:https://rasudbiaxwyoojxxdutz.supabase.co/auth/v1}
supabase.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://rasudbiaxwyoojxxdutz.supabase.co/auth/v1/.well-known/jwks.json}

# ============================================================================
# Pasarela de Pagos Mercado Pago
# ============================================================================
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:TEST-placeholder}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:TEST-placeholder}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.api-url=${MERCADOPAGO_API_URL:https://api.mercadopago.com}
mercadopago.live-mode=${MERCADOPAGO_LIVE_MODE:false}


