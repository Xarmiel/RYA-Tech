# ============================================================================
# Preferir render.yaml de la raíz. Esta copia admite selección explícita como Blueprint.
# rootDir siempre se resuelve desde la raíz Git, no desde la ubicación de este YAML.
# ============================================================================
services:
  - type: web
    name: rya-tech-backend
    runtime: docker
    autoDeployTrigger: checksPass
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_SCHEMA
        value: rya
      - key: DB_POOL_MAX_SIZE
        value: "2"
      - key: DB_POOL_MIN_IDLE
        value: "0"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_JWT_ISSUER
        value: https://rasudbiaxwyoojxxdutz.supabase.co/auth/v1
      - key: SUPABASE_JWKS_URI
        value: https://rasudbiaxwyoojxxdutz.supabase.co/auth/v1/.well-known/jwks.json
      - key: APP_TECHNICAL_DRAFTS_ENABLED
        value: "false"
