name: Frontend Node 24
"on":
  push:
    paths: ['frontend-angular/app/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend-angular/app/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-angular/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-angular/app/.nvmrc
          cache: npm
          cache-dependency-path: frontend-angular/app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:ci
      - name: Production build (does not deploy)
        run: npm run build
        env:
          # Only a public, non-resolving placeholder. No request is sent to this URL.
          API_URL: https://backend-ci.invalid
